[package]
name = "orberus-app"
version = "0.1.8"
edition = "2021"
description = "Menu bar app for Orberus"
license = "MIT"
publish = false

# An empty table makes this crate its own workspace. The app keeps its own
# Cargo.lock and target folder, so Tauri's many dependencies never slow down
# or weigh on the build of the core and the command at the repository root.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The core shared with the command line: config, rules, resolution, display
# helpers.
orberus-core = { path = "../../core" }
# `tray-icon` for the menu bar icon, `image-png` to load that icon from a PNG.
# `macos-private-api` allows a transparent window, needed for the frosted
# panel with rounded corners. It rules out the Mac App Store, which is not a
# target for this app.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
# The native "choose a folder" panel, asked from Rust before opening a terminal.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
