[package]
name = "claude-profiles"
version = "0.1.1"
edition = "2021"
description = "Automatic account profiles for Claude Code: the right account for each folder"
license = "MIT"

[[bin]]
name = "cprofile"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Reads the account name from Claude Code's .claude.json, for `cprofile list`
# and the menu bar app. Never used on the shim path.
# `preserve_order` keeps the keys of a settings.json in their order when
# we rewrite it. It only turns on `indexmap`, which `toml` already brings.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
