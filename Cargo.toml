# The repository is a workspace of two crates:
#   core/  everything Orberus knows and does, without any interface
#   cli/   the `orberus` command (and the `claude` shim), built on the core
# The menu bar app in app/ is built on the same core. It is kept out of this
# workspace: it has its own Cargo.lock and target folder, so Tauri's many
# dependencies never slow down or weigh on the build of the command.
[workspace]
members = ["core", "cli"]
exclude = ["app/src-tauri"]
resolver = "2"

# Written once, shared by both crates (`version.workspace = true`).
[workspace.package]
version = "0.1.7"
edition = "2021"
license = "MIT"
