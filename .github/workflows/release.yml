# Publishes the CLI as a prebuilt binary, so nobody needs Rust to install it.
# Runs when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The release holds the CLI and the menu bar app, each in its own archive.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust for both Mac architectures
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --locked

      - name: Build the CLI archive
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Build the app archive
        run: scripts/package-app.sh "${GITHUB_REF_NAME#v}"

      # After the build: compiling the app needs the frontend it just built.
      - name: Test the app
        working-directory: app/src-tauri
        run: cargo test --locked

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes --title "Claude Profiles ${GITHUB_REF_NAME#v}"
