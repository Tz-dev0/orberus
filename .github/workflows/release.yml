# Publishes the CLI as a prebuilt binary, so nobody needs Rust to install it.
# Runs when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The menu bar app is not built here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust for both Mac architectures
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --locked

      - name: Build the archive
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes --title "cprofile ${GITHUB_REF_NAME#v}"
