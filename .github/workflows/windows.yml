# Windows is not supported yet. This workflow shows how far the CLI gets
# there: it runs the unit tests, builds cprofile.exe and tries the everyday
# commands in an empty home. The .exe is kept as an artifact for 14 days.
name: Windows

# Started by hand from the Actions tab: macOS comes first for now.
on:
  workflow_dispatch:

jobs:
  cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Try the commands
        # Git Bash ships with the Windows runner.
        shell: bash
        run: scripts/smoke.sh target/release/cprofile.exe

      - name: Keep cprofile.exe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cprofile-windows
          path: target/release/cprofile.exe
          retention-days: 14
